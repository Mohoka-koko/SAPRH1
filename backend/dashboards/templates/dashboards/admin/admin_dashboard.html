{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.P.R.H</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/logo3.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <header class="header">
        <div class="logo">
            <img src="{% static 'img/logo3.jpg' %}" alt="Logo">
            <h1>S.A.P.R.H</h1>
        </div>
    
        <nav class="navbar">
            <ul class="nav-list">
                <li class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <a href="{% url 'home' %}">
                        <i class="fa-solid fa-house nav-icon"></i>
                        <span>Inicio</span>
                    </a>
                </li>
                <li class="{% if request.resolver_match.url_name == 'cargarpresupuesto' %}active{% endif %}">
                    <a href="{% url 'cargarpresupuesto' %}">
                        <i class="fa-solid fa-upload nav-icon"></i>
                        <span>Cargar Presupuesto Inicial</span>
                    </a>
                </li>
                <li class="{% if request.resolver_match.url_name == 'registros' %}active{% endif %}">
                    <a href="{% url 'registros' %}">
                        <i class="fa-solid fa-clipboard-list nav-icon"></i>
                        <span>Panel Registro</span>
                    </a>
                </li>
                <li class="{% if request.resolver_match.url_name == 'usuarios' %}active{% endif %}">
                    <a href="{% url 'usuarios' %}">
                        <i class="fa-solid fa-users nav-icon"></i>
                        <span>Usuarios</span>
                    </a>
                </li>
            </ul>
        </nav>
    
        <div class="user-menu">
            <div class="user-card">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <span class="user-name">{{ usuario.nombre }}</span>
                    <span class="user-role">{{ usuario.get_rol_display }}</span>
                </div>
            </div>
            <a href="{% url 'logout' %}">
                <button class="logout-btn" title="Cerrar Sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </a>            
        </div>
    </header>
    <!---<li class="{% if request.resolver_match.url_name == 'configuracion' %}active{% endif %}">
                    <a href="{% url 'configuracion' %}">
                        <i class="fa-solid fa-gear nav-icon"></i>
                        Configuración
                    </a>
                </li>--->

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
