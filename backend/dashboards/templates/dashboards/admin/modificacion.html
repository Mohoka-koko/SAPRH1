
{% extends 'dashboards/admin/admin_dashboard.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/refuerzomodificacion.css' %}">
{% endblock %}

{% block content %}

<div class="pagina">
    <div class="header-pagina">

        <!-- BOTÓN VOLVER -->
        <a href="{% url 'registros' %}" class="btn-volver">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Volver</span>
        </a>

        <!-- TÍTULO PRINCIPAL -->
        <h1 class="titulo-principal">Modificación</h1>
    </div>

    <!-- BARRA DE FILTRADO -->
    <div class="barra-filtrado">
        <div class="filtro-grupo">
            <span class="filtrado-label">Filtrado:</span>
            <span class="campo-label">Campo</span>

            <div class="select-wrapper">
                <select id="campo-filtro" class="select-campo">
                    <option value="fecha">Fecha</option>
                    <option value="transferente">N° Unidad Transferente</option>
                    <option value="receptora">N° Unidad Receptora</option>
                    <option value="expediente">N° Expediente</option>
                    <option value="usuario">Usuario</option>
                    <option value="decreto">Decreto/Resolución</option>
                    <option value="importe">Importe</option>
                </select>
            </div>
        </div>

        <div class="busqueda-grupo">
            <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; pointer-events:none;">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </span>

            <input
                type="text"
                id="input-busqueda"
                class="input-busqueda"
                placeholder="Buscar..."
                style="padding-left:36px;"
            />

            <button
                class="btn-buscar"
                id="btn-buscar"
                title="Buscar"
                style="display:none;">
            </button>
        </div>
    </div>

    <!-- TABLA -->
    <div class="tabla-wrapper">
        <table class="tabla-registros" id="tabla-registros">
            <thead id="thead-tabla"></thead>
            <tbody id="tbody-tabla"></tbody>
        </table>

        <div class="sin-resultados" id="sin-resultados" style="display:none;">
            <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#9ca3af" style="margin-bottom: 8px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>No se encontraron registros que coincidan con la búsqueda.</p>
        </div>

        <!-- PAGINACIÓN -->
        <div class="table-footer">
            <div class="pagination-info"></div>

            <div class="pagination-buttons">
                <span class="page-number-text"></span>
                <button class="btn-page btn-prev">&lt; Prev</button>
                <button class="btn-page btn-next">Next &gt;</button>
            </div>
        </div>
    </div>

    <!-- BOTÓN AGREGAR -->
    <a href="{% url 'modificacion_crear' %}" class="btn-agregar-wrapper">
        <button class="btn-agregar" id="btn-agregar" title="Agregar registro">+</button>
    </a>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'js/modificacion.js' %}"></script>
{% endblock %}
