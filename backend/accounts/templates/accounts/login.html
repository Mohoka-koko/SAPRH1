{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/logo3.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body class="login-page">

    <div class="iniciosesion">
        <div class="iniciosesion-box">

            <div class="header-login">
                <img src= "{% static 'img/logo1.png' %}" class="logo-izq" alt="Logo izquierdo">

                <div class="titulo">
                    <p>Sistema de Administración</p>
                    <p>Presupuestaria de Recursos Hídricos</p>
                </div>

                <img src= "{% static 'img/logo3.jpg' %}" class="logo-der" alt="Logo derecho">
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
            
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="email" placeholder="correo@ejemplo.com">
            
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">
            
                <button type="submit">Ingresar</button>
            </form>

        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>

</body>
</html>
